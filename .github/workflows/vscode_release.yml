jobs:
  check_version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    defaults:
      run:
        working-directory: vscodePlugin/Takatime

    steps:
      - name: Checkout previous
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.before }}
        continue-on-error: true

      - name: Get old version
        id: old_version
        run: |
          if [ -f "./package.json" ]; then
            echo "value=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          else
            echo "value=" >> $GITHUB_OUTPUT
          fi

      - name: Checkout current
        uses: actions/checkout@v4

      - name: Get actual version and compare
        id: compare
        run: |
          NEW=$(node -p "require('./package.json').version")
          OLD=${{ steps.old_version.outputs.value }}
          if [ "$NEW" != "$OLD" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  publish:
    needs: check_version
    if: needs.check_version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscodePlugin/Takatime

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm lint . -- --fix

      - name: Publish to VS Marketplace
        run: npx vsce publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
